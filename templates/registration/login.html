{% load static %}

<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KSC Action Center</title>

  <link rel="icon" type="image/png" href="{% static 'img/logo-armazem.png' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(circle at top,
          #0d2134 0%,
          #07111f 40%,
          #040a12 100%);

      color: #e8eef7;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      width: 100%;

      background:
        linear-gradient(160deg,
          #0d1d2d 0%,
          #091725 100%);

      border: 1px solid #20384d;

      border-radius: 20px;

      padding: 42px 48px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.30);
    }

    .brand-area {
      margin-bottom: 30px;
      text-align: center;
    }

    .brand-logo {
      display: block;
      width: 220px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 26px auto;
      object-fit: contain;
    }

    .login-title {
      margin: 0;
      color: #f1f5f9;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .login-subtitle {
      margin-top: 8px;
      margin-bottom: 0;
      color: #70879d;
      font-size: 15px;
      text-align: center;
    }

    .form-label {
      color: #f0f5fa;
      font-size: 14px;
      font-weight: 500;
    }

    .form-control {
      height: 42px;

      color: #ffffff;

      background: #07131f;

      border: 1px solid #30485e;

      border-radius: 7px;
    }

    .form-control:focus {
      color: #ffffff;

      background: #091725;

      border-color: #00c6e8;

      box-shadow:
        0 0 0 3px rgba(0, 198, 232, 0.12);
    }

    .btn-login {
      width: 100%;

      height: 42px;

      margin-top: 10px;

      color: #00141b;

      background: #12c1df;

      border: none;

      border-radius: 7px;

      font-size: 14px;
      font-weight: 800;

      transition: all 0.2s ease;
    }

    .btn-login:hover {
      color: #00141b;

      background: #29d1ec;

      transform: translateY(-1px);
    }

    .alert {
      font-size: 13px;

      border-radius: 8px;
    }

    @media (max-width: 575.98px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding: 32px 26px;
      }

      .brand-logo {
        width: 190px;
      }

      .login-title {
        font-size: 25px;
      }

    }
  </style>

</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="brand-area">

        <img src="{% static 'img/logo-armazem.png' %}" alt="Armazém Cloud" class="brand-logo">

        <h1 class="login-title">
          KSC Action Center
        </h1>

        <p class="login-subtitle">
          Gestão de postura, problemas e plano de ação.
        </p>

      </div>


      {% if form.errors %}

      <div class="alert alert-danger">
        Usuário ou senha inválidos.
      </div>

      {% endif %}


      <form method="post">

        {% csrf_token %}


        <div class="mb-3">

          <label for="id_username" class="form-label">
            Usuário
          </label>

          <input id="id_username" type="text" name="username" class="form-control" autocomplete="username" autofocus
            required>

        </div>


        <div class="mb-4">

          <label for="id_password" class="form-label">
            Senha
          </label>

          <input id="id_password" type="password" name="password" class="form-control" autocomplete="current-password"
            required>

        </div>


        <button type="submit" class="btn btn-login">
          Entrar
        </button>

      </form>

    </div>

  </div>

</body>

</html>
